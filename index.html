<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .chat-container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .user-msg { color: blue; text-align: right; margin: 5px 0; }
        .ai-msg { color: green; text-align: left; margin: 5px 0; }
        input { width: 75%; padding: 8px; }
        button { width: 20%; padding: 8px; }
    </style>
</head>
<body>

<div class="chat-container">
    <h3>AI Chatbot</h3>
    <div class="chat-box" id="chatBox"></div>
    <input type="text" id="userInput" placeholder="Ketik sesuatu...">
    <button onclick="kirimPesan()">Kirim</button>
</div>

<script src="script.js"></script>
</body>
</html>
